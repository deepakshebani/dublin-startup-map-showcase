<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Dublin Startup Map">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#132a52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f93ff"/>
      <stop offset="1" stop-color="#2f6fd8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f93ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f93ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#sky)"/>

  <!-- faint map grid -->
  <g stroke="#2a3f66" stroke-width="1" opacity="0.5">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200"/>
    <path d="M200 0 V360 M400 0 V360 M600 0 V360 M800 0 V360 M1000 0 V360"/>
  </g>
  <!-- the river Liffey, drawn in -->
  <path d="M-20 215 C 180 185, 360 250, 560 210 S 940 180, 1220 220" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.7" stroke-dasharray="1600" stroke-dashoffset="1600">
    <animate attributeName="stroke-dashoffset" from="1600" to="0" dur="2.2s" begin="0.2s" fill="freeze"/>
  </path>

  <!-- pins dropping + pulsing -->
  <g>
    <!-- pin template reused at positions -->
    <g transform="translate(250 150)">
      <circle r="26" fill="url(#glow)"><animate attributeName="r" values="18;30;18" dur="2.8s" repeatCount="indefinite"/></circle>
      <g transform="translate(0 -40)" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0 -40;0 0" dur="0.6s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze"/>
        <path d="M0 0 C -11 -16, -11 -28, 0 -34 C 11 -28, 11 -16, 0 0 Z" fill="url(#accent)" filter="url(#soft)"/>
        <circle cy="-22" r="5" fill="#eaf2ff"/>
      </g>
    </g>
    <g transform="translate(470 120)">
      <circle r="24" fill="url(#glow)"><animate attributeName="r" values="16;28;16" dur="3.1s" begin="0.4s" repeatCount="indefinite"/></circle>
      <g transform="translate(0 -40)" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0 -40;0 0" dur="0.6s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.8s" fill="freeze"/>
        <path d="M0 0 C -11 -16, -11 -28, 0 -34 C 11 -28, 11 -16, 0 0 Z" fill="url(#accent)" filter="url(#soft)"/>
        <circle cy="-22" r="5" fill="#eaf2ff"/>
      </g>
    </g>
    <g transform="translate(690 165)">
      <circle r="26" fill="url(#glow)"><animate attributeName="r" values="18;32;18" dur="2.6s" begin="0.8s" repeatCount="indefinite"/></circle>
      <g transform="translate(0 -40)" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0 -40;0 0" dur="0.6s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.1s" fill="freeze"/>
        <path d="M0 0 C -11 -16, -11 -28, 0 -34 C 11 -28, 11 -16, 0 0 Z" fill="url(#accent)" filter="url(#soft)"/>
        <circle cy="-22" r="5" fill="#eaf2ff"/>
      </g>
    </g>
    <g transform="translate(910 130)">
      <circle r="24" fill="url(#glow)"><animate attributeName="r" values="16;28;16" dur="3.3s" begin="0.2s" repeatCount="indefinite"/></circle>
      <g transform="translate(0 -40)" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0 -40;0 0" dur="0.6s" begin="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.4s" fill="freeze"/>
        <path d="M0 0 C -11 -16, -11 -28, 0 -34 C 11 -28, 11 -16, 0 0 Z" fill="url(#accent)" filter="url(#soft)"/>
        <circle cy="-22" r="5" fill="#eaf2ff"/>
      </g>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(600 300)" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text y="0" font-size="46" font-weight="800" fill="#f3f7ff" letter-spacing="0.5">
      Dublin Startup Map
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.2s" fill="freeze"/>
    </text>
    <text y="30" font-size="18" font-weight="500" fill="#9db4da">
      Every startup and tech company hiring in Dublin, on one map
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.5s" fill="freeze"/>
    </text>
  </g>
</svg>
